name: Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ========================================================
  # JOB 1: BACKEND VALIDATION (Python / FastAPI / uv / pytest)
  # ========================================================
  backend-ci:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Backend Test Suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          DATABASE_URL_POOLED: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key-for-testing-purposes-must-be-long"
          CORS_ORIGINS: '["http://localhost:5173"]'
        run: uv run pytest

  # ========================================================
  # JOB 2: FRONTEND VALIDATION (React / Vite / Node)
  # ========================================================
  frontend-ci:
    name: Frontend Build Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Production Build
        env:
          VITE_API_URL: "https://medicalbilling-production.up.railway.app"
        run: npm run build
